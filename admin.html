<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Admin – Leads</title>
<style>
:root{--bg:#f7f9fa;--card:#fff;--ink:#14213d;--mute:#5b6678;--line:#dde4ea;--acc:#0e7c86;--acc-ink:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0e1522;--card:#17202f;--ink:#e8edf3;--mute:#9aa6b6;--line:#2a3547;--acc:#37b3bd;--acc-ink:#07262a}}
*{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:24px 20px}
h1{font-size:24px;margin:0 0 16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;max-width:380px}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
input{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
button{font:600 16px inherit;background:var(--acc);color:var(--acc-ink);border:0;border-radius:8px;padding:10px 16px;cursor:pointer;margin-top:16px}
button.alt{background:none;color:var(--acc);border:1px solid var(--acc);margin:0 8px 0 0}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#msg{margin-top:12px;color:#c0392b;min-height:1.5em}
#panel{display:none}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-size:14px}
th{color:var(--mute);font-weight:600}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px}
</style>
</head>
<body>
<div class="wrap">
<h1>Leads admin</h1>
<form class="box" id="login">
<label for="em">Email</label><input id="em" type="email" autocomplete="username" required>
<label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required>
<button type="submit">Log in</button>
<div id="msg" role="status"></div>
</form>
<div id="panel">
<div class="bar"><span id="count"></span><span><button class="alt" id="csv" type="button">Download CSV</button><button class="alt" id="out" type="button">Log out</button></span></div>
<div class="tw"><table><thead><tr><th>Date</th><th>Name</th><th>Email</th><th>Mobile</th><th>Interested in</th></tr></thead><tbody id="rows"></tbody></table></div>
</div>
</div>
<script>
var SB_URL="https://wimlfjmbcnxgtptlrxfs.supabase.co",SB_KEY="sb_publishable_xRTZVgPs8wQDFkM-lrVMjA_AzdZJ-9N";
var $=function(i){return document.getElementById(i)},token=null,data=[];
function esc(t){return String(t==null?"":t).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
$("login").onsubmit=async function(e){e.preventDefault();$("msg").textContent="Logging in...";
 try{var r=await fetch(SB_URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:{"apikey":SB_KEY,"Content-Type":"application/json"},body:JSON.stringify({email:$("em").value.trim(),password:$("pw").value})});
  var j=await r.json();if(!r.ok||!j.access_token)throw new Error(j.msg||j.error_description||j.message||j.error||("Error "+r.status));token=j.access_token;$("pw").value="";await load();
 }catch(x){$("msg").textContent="Login failed: "+(x.message||"unknown error");}};
async function load(){
 var r=await fetch(SB_URL+"/rest/v1/leads?select=*&order=created_at.desc",{headers:{"apikey":SB_KEY,"Authorization":"Bearer "+token}});
 if(!r.ok)throw new Error("Logged in, but could not load leads (error "+r.status+")");data=await r.json();
 $("login").style.display="none";$("panel").style.display="block";
 $("count").textContent=data.length+(data.length===1?" lead":" leads");
 $("rows").innerHTML=data.length?data.map(function(l){return "<tr><td>"+esc(new Date(l.created_at).toLocaleString())+"</td><td>"+esc(l.full_name)+"</td><td>"+esc(l.email)+"</td><td>"+esc(l.mobile)+"</td><td>"+esc(l.interest)+"</td></tr>"}).join(""):'<tr><td colspan="5">No sign-ups yet.</td></tr>';
}
$("out").onclick=function(){token=null;data=[];$("panel").style.display="none";$("login").style.display="block";$("msg").textContent="";};
$("csv").onclick=function(){
 var q=function(v){return '"'+String(v==null?"":v).replace(/"/g,'""')+'"'};
 var t=["Date,Name,Email,Mobile,Interested in"].concat(data.map(function(l){return [l.created_at,l.full_name,l.email,l.mobile,l.interest].map(q).join(",")})).join("\n");
 var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/csv"}));a.download="leads.csv";a.click();};
</script>
</body>
</html>
